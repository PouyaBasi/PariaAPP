<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Paria – Admin</title>
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Sniglet&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    #app{padding-bottom:40px}
    .a-card{text-align:left;margin-top:12px}
    .a-card h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 6px}
    .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
    select.field{appearance:none;-webkit-appearance:none}
    .hist{border-top:2px dotted #F3B5CB;padding:10px 0}
    .hist:first-child{border-top:0}
    .ok{color:#1d7a4a}.warn{color:#B0402A}
    .row2.tight{margin-top:10px}
    .btn.small{height:42px;font-size:15px}
  </style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app" style="display:block">
  <div class="card" style="margin-top:6px"><span class="big-emoji" style="font-size:44px">🔑</span>
    <h1 class="display" style="font-size:24px">Paria – Admin</h1>
    <p class="sub">Only you need this page. Without your private key it can't do anything.</p></div>

  <div class="card a-card" id="keyCard"></div>

  <div class="card a-card" id="approveCard" style="display:none">
    <h2>Approve a payment ✅</h2>
    <p class="sub">After you have seen the receipt on Telegram, enter her username and make the activation code.</p>
    <input class="field" id="user" placeholder="Her username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <select class="field" id="months">
      <option value="1" selected>1 month</option><option value="2">2 months</option>
      <option value="3">3 months</option><option value="6">6 months</option><option value="12">12 months</option>
    </select>
    <div class="err" id="err"></div>
    <button class="btn" id="make">Approve &amp; make code</button>
    <div id="result"></div>
  </div>

  <div class="card a-card" id="histCard" style="display:none"><h2>Codes I made 🧾</h2><div id="hist"></div></div>
</div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
(function(){
  'use strict';
  const cfg = window.PARIA_CONFIG || {}, enc = new TextEncoder();
  const KEY='paria_admin_priv', HIST='paria_admin_hist';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
  const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  const dayNum=(d=new Date())=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
  const fmt=n=>new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date(n*86400000));
  const b64u=buf=>{let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
  function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
  async function copy(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}

  const pubOf = priv => ({kty:priv.kty,crv:priv.crv,x:priv.x,y:priv.y});
  async function genKey(){
    const kp = await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
    set(KEY, await crypto.subtle.exportKey('jwk', kp.privateKey));
    renderKey();
  }
  function renderKey(){
    const priv = get(KEY,null), c = $('#keyCard');
    if(!priv){
      c.innerHTML = `<h2>Step 1 · Your signing key 🔐</h2>
        <p class="sub">Create it once. The private key stays in this browser. The public key goes into <b>config.js</b>.</p>
        <button class="btn" id="gen">Create my signing key</button>
        <button class="link" id="imp">I already have a key (import)</button>`;
      $('#approveCard').style.display='none'; $('#histCard').style.display='none';
      $('#gen').onclick = genKey;
      $('#imp').onclick = () => {
        const t = prompt('Paste your PRIVATE key backup here:'); if(!t) return;
        try{ const k=JSON.parse(t); if(!k.d||!k.x||!k.y) throw 0; set(KEY,k); renderKey(); }catch(e){ toast('That is not a valid key'); }
      };
      return;
    }
    const pub = JSON.stringify(pubOf(priv));
    const match = cfg.PUBLIC_KEY && cfg.PUBLIC_KEY.x===priv.x && cfg.PUBLIC_KEY.y===priv.y;
    c.innerHTML = `<h2>Your signing key 🔐</h2>
      <p class="${match?'ok':'warn'}">${match?'✅ The app (config.js) already has this key. You are ready to approve payments.':'⚠️ config.js does not have this public key yet. Copy the line below into config.js (PUBLIC_KEY), commit, and wait a minute.'}</p>
      <p class="sub">Public key (safe to share):</p>
      <div class="note-box mono">PUBLIC_KEY: ${esc(pub)},</div>
      <div class="row2 tight"><button class="btn small" id="cpub">Copy public key line</button><button class="btn small ghost" id="cpriv">Backup private key</button></div>
      <p class="sub" style="margin-top:10px">⚠️ “Backup private key” copies your secret key. Save it in a safe place (password manager). Anyone who has it can create codes.</p>`;
    $('#cpub').onclick = async()=>toast((await copy('PUBLIC_KEY: '+pub+','))?'Copied ✓':'Could not copy');
    $('#cpriv').onclick = async()=>{ if(confirm('This copies your SECRET key. Keep it private. Continue?')) toast((await copy(JSON.stringify(priv)))?'Private key copied ✓ save it somewhere safe':'Could not copy'); };
    $('#approveCard').style.display='block'; $('#histCard').style.display='block';
    renderHist();
  }

  async function makeCode(){
    const err=$('#err'); err.textContent='';
    const u=$('#user').value.trim().toLowerCase(), months=Number($('#months').value);
    if(!/^[a-z0-9_.]{3,24}$/.test(u)){ err.textContent="Enter her username exactly as she wrote it (3–24 letters/numbers)."; return; }
    const priv=get(KEY,null); if(!priv) return;
    const hist=get(HIST,[]); const last=hist.filter(h=>h.u===u).reduce((m,h)=>Math.max(m,h.e),0);
    const start=Math.max(dayNum(), last+1);
    const e = start + (cfg.DAYS_PER_MONTH||30)*months - 1;
    const data = enc.encode(JSON.stringify({u,e}));
    const key = await crypto.subtle.importKey('jwk',priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
    const sig = await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,data);
    const code = 'PARIA1.'+b64u(data)+'.'+b64u(sig);
    hist.unshift({u,e,code,at:Date.now()}); set(HIST,hist.slice(0,100));
    showResult(u,e,code); renderHist();
  }
  const msgFor=(e,code)=>`Hi Paria 💗 Thank you! Your access is open until ${fmt(e)}.\nIn the app tap “Unlock for 1 month”, paste this code and you are in:\n\n${code}`;
  function showResult(u,e,code){
    $('#result').innerHTML = `<div class="note-box"><b class="ok">✅ Approved: ${esc(u)}</b><br>Access until <b>${esc(fmt(e))}</b></div>
      <p class="sub" style="margin-top:10px">Code:</p><div class="note-box mono" id="codebox">${esc(code)}</div>
      <div class="row2 tight"><button class="btn small" id="ccode">Copy code</button><button class="btn small ghost" id="cmsg">Copy message</button></div>
      <a class="btn small ghost" style="margin-top:10px" target="_blank" rel="noopener" href="https://t.me/share/url?url=%20&text=${encodeURIComponent(msgFor(e,code))}">Send on Telegram ✈️</a>`;
    $('#ccode').onclick=async()=>toast((await copy(code))?'Code copied ✓':'Could not copy');
    $('#cmsg').onclick=async()=>toast((await copy(msgFor(e,code)))?'Message copied ✓':'Could not copy');
  }
  function renderHist(){
    const h=get(HIST,[]);
    $('#hist').innerHTML = h.length ? h.map((x,i)=>`<div class="hist"><b>${esc(x.u)}</b> · until ${esc(fmt(x.e))}
      <div class="row2 tight"><button class="btn small ghost" data-c="${i}">Copy code</button><button class="btn small ghost" data-m="${i}">Copy message</button></div></div>`).join('')
      : '<p class="sub">Nothing yet.</p>';
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>toast((await copy(h[b.dataset.c].code))?'Code copied ✓':'Could not copy'));
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{const x=h[b.dataset.m];toast((await copy(msgFor(x.e,x.code)))?'Message copied ✓':'Could not copy')});
  }
  $('#make').onclick = () => makeCode().catch(()=>{$('#err').textContent='Something went wrong. Try again.'});
  renderKey();

  // same flowers as the app
  (function(){const c=$('#bg'),x=c.getContext('2d');let s=11;const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
    const f=Array.from({length:18},()=>({x:r(),y:r(),r:22+r()*40,p:r()*360}));
    function d(){const dpr=devicePixelRatio||1,w=innerWidth,h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
      f.forEach(q=>{x.fillStyle='#fff';for(let i=0;i<6;i++){const a=(q.p+i*60)*Math.PI/180;x.beginPath();x.arc(q.x*w+q.r*.55*Math.cos(a),q.y*h+q.r*.55*Math.sin(a),q.r*.5,0,6.2832);x.fill()}x.fillStyle='#FFE9A8';x.beginPath();x.arc(q.x*w,q.y*h,q.r*.3,0,6.2832);x.fill()})}
    d();addEventListener('resize',d)})();
})();
</script>
</body>
</html>
